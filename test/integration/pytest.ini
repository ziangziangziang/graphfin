[pytest]
log_cli = 1
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format=%Y-%m-%d %H:%M:%S
markers =
    perf: performance measurements (excluded from correctness gates)
    perf_smoke: fast workload subset of perf, selected by `qa/local/run.sh perf smoke`
    soak: sustained mixed-load soak, selected by `qa/local/run.sh soak`
