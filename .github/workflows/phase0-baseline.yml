name: phase0-baseline

# Phase 0 of the TuGraph scaling project: reproducible build, correctness tests
# and graph-count scaling benchmarks.
#
# Platform note: GitHub-hosted runners are amd64, so this workflow uses the
# upstream amd64 CentOS 7 compile image and a derived Phase 0 image that adds
# the Cython 3.0 fix (see ci/phase0/env/Dockerfile.phase0).
#
# The *authoritative* Phase 0 baseline numbers were recorded on arm64 with the
# pinned image in ci/phase0/images.lock. CI numbers are not comparable to them:
# PHASE0_SKIP_IMAGE_PIN=1 is set here, and the actual image id is recorded in
# every uploaded result. Compare like-for-like architectures only.

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']
  workflow_dispatch:
  schedule:
    # Weekly full benchmark (1/100/1000/4000 graphs) on the default branch.
    - cron: '0 3 * * 0'

env:
  PHASE0_BASE_IMAGE: tugraph/tugraph-compile-centos7:latest
  PHASE0_COMPILE_IMAGE: tugraph-compile-amd64:phase0
  PHASE0_PLATFORM: linux/amd64
  PHASE0_SKIP_IMAGE_PIN: "1"
  # Keep the benchmark comparable between runs: same limits every time.
  PHASE0_DOCKER_EXTRA: "--cpus=4 --memory=6g"

jobs:
  unit-tests:
    name: build + upstream unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          df -h
          sudo apt-get remove -y '^dotnet-.*' '^llvm-.*' 'php.*' \
            azure-cli google-chrome-stable firefox powershell mono-devel || true
          sudo apt-get autoremove -y || true
          sudo apt-get clean || true
          rm -rf /usr/share/dotnet/ /opt/hostedtoolcache || true
          df -h

      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: 'true'

      - name: Build Phase 0 compile image
        run: |
          docker build -f ci/phase0/env/Dockerfile.phase0 \
            --build-arg BASE_IMAGE="${PHASE0_BASE_IMAGE}" \
            -t "${PHASE0_COMPILE_IMAGE}" .

      - name: Environment preflight
        run: ci/phase0/doctor.sh

      - name: Build TuGraph
        run: JOBS=2 ci/phase0/build.sh

      - name: Run upstream unit tests
        run: ci/phase0/run_tests.sh ut

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-unit-test-results
          path: |
            phase0-results/
            phase0-logs/
          if-no-files-found: warn
          retention-days: 30

  integration-tests:
    name: integration + failure tests
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          sudo apt-get remove -y '^dotnet-.*' '^llvm-.*' 'php.*' \
            azure-cli google-chrome-stable firefox powershell mono-devel || true
          sudo apt-get autoremove -y || true
          sudo apt-get clean || true
          rm -rf /usr/share/dotnet/ /opt/hostedtoolcache || true
          df -h

      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: 'true'

      - name: Build Phase 0 compile image
        run: |
          docker build -f ci/phase0/env/Dockerfile.phase0 \
            --build-arg BASE_IMAGE="${PHASE0_BASE_IMAGE}" \
            -t "${PHASE0_COMPILE_IMAGE}" .

      - name: Build TuGraph
        run: JOBS=2 ci/phase0/build.sh

      - name: Run integration tests
        run: ci/phase0/run_tests.sh it

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-integration-test-results
          path: |
            phase0-results/
            phase0-logs/
          if-no-files-found: warn
          retention-days: 30

  benchmark-smoke:
    name: benchmark smoke (1, 100 graphs)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Free disk space
        run: |
          sudo apt-get remove -y '^dotnet-.*' '^llvm-.*' 'php.*' \
            azure-cli google-chrome-stable firefox powershell mono-devel || true
          sudo apt-get autoremove -y || true
          sudo apt-get clean || true
          rm -rf /usr/share/dotnet/ /opt/hostedtoolcache || true
          df -h

      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: 'true'

      - name: Build Phase 0 compile image
        run: |
          docker build -f ci/phase0/env/Dockerfile.phase0 \
            --build-arg BASE_IMAGE="${PHASE0_BASE_IMAGE}" \
            -t "${PHASE0_COMPILE_IMAGE}" .

      - name: Build TuGraph
        run: JOBS=2 ci/phase0/build.sh

      - name: Run smoke benchmark
        run: |
          ci/phase0/run_bench.sh --graphs 1 100 \
            --out benchmark/scaling/results/smoke.json

      - name: Render report
        if: always()
        run: |
          python3 benchmark/scaling/report.py \
            benchmark/scaling/results/smoke.json \
            -o benchmark/scaling/results/SMOKE.md || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-benchmark-smoke
          path: |
            benchmark/scaling/results/smoke.json
            benchmark/scaling/results/SMOKE.md
          if-no-files-found: warn
          retention-days: 30

  benchmark-full:
    name: benchmark full (1, 100, 1000, 4000 graphs)
    # Expensive: manual dispatch or the weekly schedule only.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 720
    steps:
      - name: Free disk space
        run: |
          sudo apt-get remove -y '^dotnet-.*' '^llvm-.*' 'php.*' \
            azure-cli google-chrome-stable firefox powershell mono-devel || true
          sudo apt-get autoremove -y || true
          sudo apt-get clean || true
          rm -rf /usr/share/dotnet/ /opt/hostedtoolcache || true
          df -h

      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: 'true'

      - name: Build Phase 0 compile image
        run: |
          docker build -f ci/phase0/env/Dockerfile.phase0 \
            --build-arg BASE_IMAGE="${PHASE0_BASE_IMAGE}" \
            -t "${PHASE0_COMPILE_IMAGE}" .

      - name: Build TuGraph
        run: JOBS=2 ci/phase0/build.sh

      - name: Run full benchmark
        # Benchmark phases are individually error-isolated, so a failure at
        # 4000 graphs still produces a complete result document.
        run: |
          ci/phase0/run_bench.sh --graphs 1 100 1000 4000 \
            --out benchmark/scaling/results/baseline-ci.json

      - name: Render report
        if: always()
        run: |
          python3 benchmark/scaling/report.py \
            benchmark/scaling/results/baseline-ci.json \
            -o benchmark/scaling/results/BASELINE-CI.md || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-benchmark-full
          path: |
            benchmark/scaling/results/baseline-ci.json
            benchmark/scaling/results/BASELINE-CI.md
            phase0-logs/
          if-no-files-found: warn
          retention-days: 90

      - name: Check disk space
        if: always()
        run: df -h
