name: ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# Cancel superseded runs on the same ref (avoids stacked 70-minute builds).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege GITHUB_TOKEN (CodeQL missing-actions-permissions):
# default to read-only; jobs needing artifact upload / GHA cache widen it.
permissions:
  contents: read

env:
  TEST_TAG: graphfin-ut:test
  PR_TEST_TAG: graphfin-pr:test

jobs:
  # ---------------------------------------------------------------------------
  # Decides whether a PR needs the (expensive) C++ gate. Docs/site-only PRs
  # skip it so the ~40 min build is not paid for by a README change.
  # ---------------------------------------------------------------------------
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Detect build-relevant changes
        id: filter
        run: |
          # Anything that can change compilation, the test binary, or how
          # tests are selected must run the gate. Site/docs-only changes do not.
          # Fail closed: any failure computing the file list runs the gate
          # rather than silently skipping it.
          set -o pipefail
          if ! changed="$(git diff --name-only \
               "${{ github.event.pull_request.base.sha }}" \
               "${{ github.event.pull_request.head.sha }}")"; then
            echo "engine=true" >> "$GITHUB_OUTPUT"
            echo "could not compute changed files; running pr_engine_gate"
            exit 0
          fi
          # Directories whose contents feed the build or test selection, plus
          # any CMakeLists.txt / *.cmake file anywhere: the root CMakeLists
          # includes ./Options.cmake, so a bare *.cmake pattern would let a
          # build-flag change bypass the gate. The $ anchors apply to the file
          # alternatives only: directory prefixes must stay open so files
          # beneath them match (^(...|src/)$ would match just "src/").
          if printf '%s\n' "$changed" \
             | grep -qE '^(\.github/workflows/ci\.yml$|src/|test/|deps/|cmake/|include/|ci/|.*CMakeLists\.txt$|.*\.cmake$)'; then
            echo "engine=true" >> "$GITHUB_OUTPUT"
            echo "build-relevant changes detected"
          else
            echo "engine=false" >> "$GITHUB_OUTPUT"
            echo "no build-relevant changes; skipping pr_engine_gate"
          fi

  # ---------------------------------------------------------------------------
  # Fast checks — PR and main (~1–2 min): lint + typecheck + unit only.
  # No C++ build here; the targeted C++ gate lives in pr_engine_gate below.
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: cpplint
        run: bash ./cpplint/check_all.sh
      - name: Product/docs checks
        run: python3 ci/release/check_docs.py
      - name: PR gate filter regression check
        # Guards the changes→pr_engine_gate routing itself: pattern and step
        # logic are extracted from this file at test time, so a filter edit
        # that lets engine PRs skip the gate fails here instead of silently.
        run: python3 test/check_pr_filter.py

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test

  # ---------------------------------------------------------------------------
  # PR-only: targeted C++ build + pr-unit slice (series/sharding/admission +
  # the DB-01 and DB-02 regression guards). Slower than lint but far cheaper
  # than the main-only full suite, so correctness gates land before merge.
  # Mark this job required in branch protection to make it binding.
  # ---------------------------------------------------------------------------
  pr_engine_gate:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    # Provisional: the cold seed is unmeasured. Raise it once a real cold run
    # reports a duration; do not lower it below the observed cold time.
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write # buildx GHA cache (cache-from / cache-to)
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update -qq && sudo apt-get remove -y '^dotnet-.*' '^llvm-.*' azure-cli google-chrome-stable firefox powershell || true
          sudo apt-get autoremove -y || true
          sudo apt-get clean || true
          df -h
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: "true"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build PR image
        uses: docker/build-push-action@v7
        with:
          file: ci/images/github-pr-ubuntu-latest-Dockerfile
          context: .
          tags: ${{ env.PR_TEST_TAG }}
          load: true
          build-args: |
            BUILD_TYPE=no_asan
            TEST_TYPE=pr
          cache-from: type=gha,scope=pr-engine
          cache-to: type=gha,scope=pr-engine,mode=max
      - name: Run PR tests with exported results
        # Tests run here, not during the image build: the results directory is
        # mounted out of the container, so the XML evidence below exists pass
        # or fail. (Docker's documented test-before-push split.)
        run: |
          mkdir -p testresult
          docker run --rm \
            -v "$PWD/testresult:/root/tugraph-db/testresult" \
            "${{ env.PR_TEST_TAG }}" \
            bash /root/tugraph-db/ci/github_pr_test.sh
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-gtest-results
          path: testresult/
          if-no-files-found: error
      - name: Check disk space
        if: always()
        run: df -h

  # ---------------------------------------------------------------------------
  # Main-only: full ~70-minute suite (coverage + asan + full it)
  # ---------------------------------------------------------------------------
  ut_no_asan:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # buildx GHA cache (cache-from / cache-to)
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update -qq && sudo apt-get remove -y '^dotnet-.*' '^llvm-.*' azure-cli google-chrome-stable firefox powershell || true
          sudo apt-get autoremove -y || true
          sudo apt-get clean || true
          df -h
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: "true"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Unit Test
        uses: docker/build-push-action@v7
        with:
          file: ci/images/github-ci-ubuntu-latest-Dockerfile
          context: .
          tags: ${{ env.TEST_TAG }}
          build-args: |
            BUILD_TYPE=no_asan
            TEST_TYPE=ut
          cache-from: type=gha,scope=full-no-asan
          cache-to: type=gha,scope=full-no-asan,mode=max
          secrets: |
            ${{ secrets.CODECOV_TOKEN && format('CODECOV_TOKEN={0}', secrets.CODECOV_TOKEN) || '' }}
      - name: Check disk space
        if: always()
        run: df -h

  ut_asan:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # buildx GHA cache (cache-from / cache-to)
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update -qq && sudo apt-get remove -y '^dotnet-.*' '^llvm-.*' azure-cli google-chrome-stable firefox powershell || true
          sudo apt-get autoremove -y || true
          sudo apt-get clean || true
          df -h
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: "true"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Unit Test (ASan)
        uses: docker/build-push-action@v7
        with:
          file: ci/images/github-ci-ubuntu-latest-Dockerfile
          context: .
          tags: ${{ env.TEST_TAG }}
          build-args: |
            BUILD_TYPE=asan
            TEST_TYPE=ut
          cache-from: type=gha,scope=full-asan
          cache-to: type=gha,scope=full-asan,mode=max
          secrets: |
            ${{ secrets.CODECOV_TOKEN && format('CODECOV_TOKEN={0}', secrets.CODECOV_TOKEN) || '' }}
      - name: Check disk space
        if: always()
        run: df -h

  it:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # buildx GHA cache (cache-from / cache-to)
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update -qq && sudo apt-get remove -y '^dotnet-.*' '^llvm-.*' azure-cli google-chrome-stable firefox powershell || true
          sudo apt-get autoremove -y || true
          sudo apt-get clean || true
          df -h
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: "true"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Integration Test
        uses: docker/build-push-action@v7
        with:
          file: ci/images/github-ci-ubuntu-latest-Dockerfile
          context: .
          tags: ${{ env.TEST_TAG }}
          build-args: |
            BUILD_TYPE=no_asan
            TEST_TYPE=it
          cache-from: type=gha,scope=full-it
          cache-to: type=gha,scope=full-it,mode=max
          secrets: |
            ${{ secrets.CODECOV_TOKEN && format('CODECOV_TOKEN={0}', secrets.CODECOV_TOKEN) || '' }}
      - name: Check disk space
        if: always()
        run: df -h
