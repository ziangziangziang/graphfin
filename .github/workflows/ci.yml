name: ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# Cancel superseded runs on the same ref (avoids stacked 70-minute builds).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_TAG: graphfin-ut:test
  COMPILE_IMAGE: tugraph/tugraph-compile-centos7:latest

jobs:
  # ---------------------------------------------------------------------------
  # Fast checks — PR and main (~1–2 min)
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: cpplint
        run: bash ./cpplint/check_all.sh
      - name: Product/docs checks
        run: python3 ci/release/check_docs.py

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test

  # ---------------------------------------------------------------------------
  # PR-only: targeted C++ build + fast unit/it (~5–15 min warm ccache)
  # ---------------------------------------------------------------------------
  pr-targeted:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: []
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: "true"
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-pr-${{ github.sha }}
          restore-keys: |
            ccache-pr-
            ccache-main-
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update -qq && sudo apt-get remove -y '^dotnet-.*' '^llvm-.*' azure-cli google-chrome-stable firefox powershell || true
          sudo apt-get autoremove -y || true
          sudo apt-get clean || true
          df -h
      - name: Build and run targeted tests
        run: |
          mkdir -p .ccache
          docker run --rm \
            -v "$PWD:/workspace" \
            -v "$PWD/.ccache:/root/.ccache" \
            -w /workspace \
            -e WORKSPACE=/workspace \
            -e CCACHE_DIR=/root/.ccache \
            -e HOME=/root \
            "$COMPILE_IMAGE" \
            bash -lc 'yum install -y epel-release ccache >/dev/null 2>&1 || yum install -y ccache >/dev/null 2>&1 || true; bash ci/github_pr.sh'
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-test-results
          path: testresult/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Main-only: full ~70-minute suite (coverage + asan + full it)
  # ---------------------------------------------------------------------------
  ut_no_asan:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update -qq && sudo apt-get remove -y '^dotnet-.*' '^llvm-.*' azure-cli google-chrome-stable firefox powershell || true
          sudo apt-get autoremove -y || true
          sudo apt-get clean || true
          df -h
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: "true"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Unit Test
        uses: docker/build-push-action@v7
        with:
          file: ci/images/github-ci-ubuntu-latest-Dockerfile
          context: .
          tags: ${{ env.TEST_TAG }}
          build-args: |
            BUILD_TYPE=no_asan
            TEST_TYPE=ut
          cache-from: type=gha,scope=full-no-asan
          cache-to: type=gha,scope=full-no-asan,mode=max
          secrets: |
            ${{ secrets.CODECOV_TOKEN && format('CODECOV_TOKEN={0}', secrets.CODECOV_TOKEN) || '' }}
      - name: Check disk space
        if: always()
        run: df -h

  ut_asan:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update -qq && sudo apt-get remove -y '^dotnet-.*' '^llvm-.*' azure-cli google-chrome-stable firefox powershell || true
          sudo apt-get autoremove -y || true
          sudo apt-get clean || true
          df -h
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: "true"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Unit Test (ASan)
        uses: docker/build-push-action@v7
        with:
          file: ci/images/github-ci-ubuntu-latest-Dockerfile
          context: .
          tags: ${{ env.TEST_TAG }}
          build-args: |
            BUILD_TYPE=asan
            TEST_TYPE=ut
          cache-from: type=gha,scope=full-asan
          cache-to: type=gha,scope=full-asan,mode=max
          secrets: |
            ${{ secrets.CODECOV_TOKEN && format('CODECOV_TOKEN={0}', secrets.CODECOV_TOKEN) || '' }}
      - name: Check disk space
        if: always()
        run: df -h

  it:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update -qq && sudo apt-get remove -y '^dotnet-.*' '^llvm-.*' azure-cli google-chrome-stable firefox powershell || true
          sudo apt-get autoremove -y || true
          sudo apt-get clean || true
          df -h
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: "true"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Integration Test
        uses: docker/build-push-action@v7
        with:
          file: ci/images/github-ci-ubuntu-latest-Dockerfile
          context: .
          tags: ${{ env.TEST_TAG }}
          build-args: |
            BUILD_TYPE=no_asan
            TEST_TYPE=it
          cache-from: type=gha,scope=full-it
          cache-to: type=gha,scope=full-it,mode=max
          secrets: |
            ${{ secrets.CODECOV_TOKEN && format('CODECOV_TOKEN={0}', secrets.CODECOV_TOKEN) || '' }}
      - name: Check disk space
        if: always()
        run: df -h
