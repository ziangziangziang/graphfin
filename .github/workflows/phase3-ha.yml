name: phase3-ha

# Phase 3 of the TuGraph scaling project: production-grade replication and
# high availability. Runs HA-specific integration tests (leader election,
# failover, chaos) against a built lgraph_server.
#
# These tests are heavier than regular integration tests: they start 3-node
# HA clusters. They run on pull_request to main and on workflow_dispatch.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  ha-integration:
    name: HA integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: |
          df -h
          sudo apt-get remove -y '^dotnet-.*' '^llvm-.*' 'php.*' \
            azure-cli google-chrome-stable firefox powershell mono-devel || true
          sudo apt-get autoremove -y || true
          sudo apt-get clean || true
          rm -rf /usr/share/dotnet/ /opt/hostedtoolcache || true
          df -h

      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: 'true'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and run HA tests
        uses: docker/build-push-action@v4
        with:
          file: ci/images/github-ci-ubuntu-latest-Dockerfile
          context: .
          tags: tugraph/tugraph-ha:test
          build-args: |
            BUILD_TYPE=no_asan
            TEST_TYPE=ha

      - name: Check disk space
        if: always()
        run: df -h