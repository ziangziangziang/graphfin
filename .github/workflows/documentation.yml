name: GraphFin website
on:
  push:
    branches: [main, master]
    paths: ["site/**", "assets/**", ".github/workflows/documentation.yml"]
  pull_request:
    paths: ["site/**", "assets/**", ".github/workflows/documentation.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: graphfin-pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          SITE_BASE_PATH: /${{ github.event.repository.name }}/
          SITE_SOURCE_REF: ${{ github.head_ref || github.ref_name }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
