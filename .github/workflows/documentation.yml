name: GraphFin website
on:
  push:
    branches: [main]
    paths: ["site/**", "assets/**", ".github/workflows/documentation.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: graphfin-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          SITE_BASE_PATH: /${{ github.event.repository.name }}/
          SITE_SOURCE_REF: ${{ github.head_ref || github.ref_name }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site/dist
          clean: true
